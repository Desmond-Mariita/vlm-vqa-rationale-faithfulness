backbone:
  gen:
    do_sample: false
    max_new_tokens: 128
    temperature: 0.2
    top_p: 0.9
  model_name: Qwen/Qwen2.5-VL-3B-Instruct
  processor_name: Qwen/Qwen2.5-VL-3B-Instruct
  revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
data:
  images_plain_train: data/processed/vcr/train/images
  images_plain_val: data/processed/vcr/val/images
  images_point_train: data/final/train/images
  images_point_val: data/final/val/images
  json_train_by_mode:
    debug: data/final/vcr_train_0.1_pct.json
    full: data/final/vcr_train_final_with_orig.json
    thesis: data/final/vcr_train_5_pct.json
  json_train_path: data/final/vcr_train_5_pct.json
  json_val_by_mode:
    debug: data/final/vcr_val_1_pct.json
    full: data/final/vcr_val_final_with_orig.json
    thesis: data/final/vcr_val_10_pct.json
  json_val_path: data/final/vcr_val_10_pct.json
  split_train: train
  split_val: val
eval:
  bertscore_batch: 16
  bertscore_model: roberta-large
  bleurt_batch: 16
  bleurt_ckpt: Elron/bleurt-base-128
  bleurt_device: cpu
  compute_bertscore: true
  compute_bleu: true
  compute_bleurt: true
eval_stage2:
  cot_max_examples: -1
  cot_samples: 1
  cot_temperature: 0.7
  cot_top_p: 0.9
  cross_modal_judge:
    constrained_choices:
    - 0
    - 1
    - 2
    - 3
    kind: text_only
    model: Qwen/Qwen2.5-3B-Instruct
  enable_consistency_metrics: true
  enable_robustness_metrics: true
  enable_sufficiency_metrics: true
  val_gen_heavy_artifacts: last_epoch
  val_gen_subsample_per_epoch: 200
experiment:
  arm: point_desc
  base_name: qwen_stage2_point_desc
  caption_key: image_descriptions.caption
  name: qwen_stage1_point_desc
loader:
  batch_size: 2
  drop_last: false
  num_workers: 4
  pin_memory: true
  shuffle: true
logging:
  log_every_steps: 50
  use_tensorboard: true
mode: thesis
paths:
  plots_dir: reports/generated/point_desc/stage1/plots/
  predictions_dir: reports/generated/point_desc/stage1/outputs/
  rationales_jsonl: reports/generated/point_desc/stage1/outputs/Route2/generated_rationales.jsonl
  tables_dir: reports/generated/point_desc/stage1/tables/
peft:
  alpha: 64
  dropout: 0.05
  r: 32
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - mlp.up_proj
  - mlp.down_proj
  use_lora: true
project:
  log_dir: reports/generated/point_desc/stage1/logs/
  name: vcr_route2_qwen_lora
  output_dir: reports/generated/point_desc/stage1/
  save_dir: reports/generated/point_desc/stage1/checkpoints/
  seed: 42
prompts:
  region_tag_template: <region> {region_text} </region>
  stage1_template: "<image>\nQuestion: {question}\nChoices:\n  (A) {c0}\n  (B) {c1}\n\
    \  (C) {c2}\n  (D) {c3}\nInstruction: Select the best option and answer with a\
    \ single letter (A/B/C/D).\n"
  stage2_template: '<image>

    Question: {question}

    Chosen Answer: {answer_text}


    Explain your reasoning step by step, focusing only on what can be seen in the
    image.

    Then give a short final justification.


    Use the following format exactly:


    <reasoning>

    ...detailed step-by-step reasoning about the image, question, and answer...

    </reasoning>

    <final>

    ...short 2–3 sentence justification...

    </final>

    '
statistics:
  bootstrap_resamples: 2000
  ci_level: 0.95
  seed: 42
train:
  early_stopping:
    mode: max
    monitor: val/accuracy
    patience: 3
  gradient_accumulation_steps: 6
  load_in_4bit: true
  load_in_8bit: false
  lr_lora: 0.0001
  max_epochs_stage1: 3
  max_epochs_stage2: 6
  max_grad_norm: 1.0
  mixed_precision: bf16
  resume_from: ''
  resume_from_stage2: ''
  save_every_steps: 100
  warmup_ratio: 0.05
  weight_decay: 0.01
train_stage2:
  answer_source: gold
  bf16: true
  grad_accum: 2
  lr: 5.0e-05
  max_epochs: 6
  max_new_tokens: 128
  mixed_precision: bf16
  save_every_steps: 100
  stage2_prompt_template: "You are an expert visual commonsense reasoner.\n\nYou see\
    \ an image and a multiple-choice question with four options.\nYour task is to\
    \ explain, step by step, why a given answer is correct,\nusing only what can reasonably\
    \ be inferred from the image and question.\n\nQuestion: {question}\n\nChoices:\n\
    \  (0) {c0}\n  (1) {c1}\n  (2) {c2}\n  (3) {c3}\n\nThe correct answer is choice\
    \ index {answer_idx}: \"{answer}\".\n\nExplain your reasoning step by step, focusing\
    \ only on what can be seen\nin the image (and what follows directly from it).\n\
    Then give a short final justification.\nContinue until the explanation is complete\
    \ and well-formed.\n\nUse the following format exactly:\n\n<reasoning>\n...detailed\
    \ step-by-step reasoning about the image, question, and answer...\n</reasoning>\n\
    <final>\n...short 2–3 sentence justification...\n</final>\n"
  stage2_prompt_template_pred: "You are reflecting on your own decision in a visual\
    \ question answering task.\n\nYou see an image and a multiple-choice question\
    \ with four options.\nYour task is to explain, step by step, why the answer you\
    \ chose is (or seems)\ncorrect, using only what can reasonably be inferred from\
    \ the image and question.\n\nQuestion: {question}\n\nChoices:\n  (0) {c0}\n  (1)\
    \ {c1}\n  (2) {c2}\n  (3) {c3}\n\nYou picked choice index {answer_idx}: \"{answer}\"\
    .\n\nExplain your reasoning step by step, focusing only on what can be seen\n\
    in the image (and what follows directly from it).\nThen give a short final justification.\n\
    Continue until the explanation is complete and well-formed.\n\nUse the following\
    \ format exactly:\n\n<reasoning>\n...detailed step-by-step reasoning about the\
    \ image, question, and answer...\n</reasoning>\n<final>\n...short 2–3 sentence\
    \ justification...\n</final>\n"
  warmup_ratio: 0.05
  weight_decay: 0.0
