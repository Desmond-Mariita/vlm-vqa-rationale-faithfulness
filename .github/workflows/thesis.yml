name: Thesis source status (PDF on hold)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: make thesis-status
      - run: echo 'Exact PDF reproduction remains on hold; signature and university logo are withheld. No PDF is built.'
